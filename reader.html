<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#120e19" />
  <title>ESAP 2026 — reader</title>
  <link rel="stylesheet" href="reader.css" />
</head>
<body>
  <header class="bar">
    <button type="button" class="close" id="close" aria-label="Close">✕</button>
    <span class="label" id="label">ESAP 2026</span>
    <span class="ind" id="page-ind"></span>
  </header>
  <div class="find">
    <input id="find-input" type="search" placeholder="Search the book" autocomplete="off" spellcheck="false" />
    <button type="button" id="find-btn">Find</button>
  </div>
  <div class="loadbar" id="loadbar" hidden><div class="loadfill" id="loadfill"></div></div>
  <div class="strip" id="strip">Loading the book…</div>
  <main class="pages" id="pages"></main>
  <script src="vendor/pdf.min.js"></script>
  <script src="reader.js"></script>
</body>
</html>
